image: registry.gitlab.info.uqam.ca/inf31351/docker/base

default:
  tags:
    - calcul_runner1

stages:
  - build
  - test
  
before_script:
    - apt update
    - apt install -y curl
    - apt install -y m4
    - apt install -y gnuplot
    - curl -L -o jansson.tar.gz https://digip.org/jansson/releases/jansson-2.13.tar.gz
    - tar -xzf jansson.tar.gz
    - cd jansson-2.13
    - ./configure
    - make
    - make install
    - cd ..

build:
  stage: build
  script:
    - make build
  artifacts:
    paths:
      - bin/tempo

test-bats:
  stage: test
  script:
    - make test-bats

test-libtap:
  stage: test
  script:
    - make test-libtap
